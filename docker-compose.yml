services:
  # Build-only service. Produces the `xupertrade-bot:latest` image that
  # the dashboard's bot-orchestrator (lib/bot-orchestrator.ts) spawns
  # per-tenant bot containers from. The image tag is overridable via
  # HYPERTRADE_BOT_IMAGE on the dashboard service.
  #
  # Profile-gated so `docker compose up -d` (no profile) never tries
  # to start it as a long-running service — it has no command, no
  # depends_on, and isn't meant to run. Build it explicitly with:
  #
  #   GIT_SHA=$(git rev-parse HEAD) docker compose --profile build build --no-cache --pull bot-image
  #
  # (GIT_SHA is the version stamp; see the build args below.) On the
  # production host, build it only in the weekly bot-deploy window
  # (docs/runbooks/deploy.md): every bot Start runs whatever this tag
  # is at that moment, so a mid-week rebuild from master reaches the
  # next Stop/Start of any bot.
  bot-image:
    profiles: [build]
    build:
      context: ./bot
      args:
        # Version stamp (GET /api/version, OCI label
        # org.opencontainers.image.revision). Pass the commit being
        # built, evaluated on the build host after its checkout, e.g.
        #   GIT_SHA=$(git rev-parse HEAD) phase run -- docker compose \
        #     --profile build build --no-cache --pull bot-image
        # Inside `ssh host "..."` write `GIT_SHA=\$(git rev-parse HEAD)`.
        # Unescaped, your local shell expands it to whatever your own
        # clone has checked out, and the image reports that commit:
        # nothing checks the value beyond "looks like hex".
        # Unset → "unknown": the build still succeeds, the endpoint just
        # can't say which commit it is.
        GIT_SHA: "${GIT_SHA:-unknown}"
    image: xupertrade-bot:latest
    # No-op command + restart=no — this entry exists only so compose
    # knows how to build the image; running it just exits cleanly.
    command: ["true"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hypertrade
      POSTGRES_USER: postgres
      # Required: must be injected via `phase run -- docker compose ...`
      # (or any other env source). The `:?` syntax fails compose-up with
      # the supplied message if the var is unset/empty — fail-fast rather
      # than silently defaulting to the literal `postgres` (which is what
      # this file did pre-2026-05-14 and which leaked the DB to anyone
      # who could reach :5432).
      #
      # POSTGRES_PASSWORD must be URL-safe (no @ : / ? # =) — embedded in
      # DATABASE_URL below without URL-encoding. The recommended generator
      # `openssl rand -base64 36 | tr -d '/+='` produces compliant output.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (use 'phase run -- docker compose ...')}
    ports:
      # Loopback-only. Was "5432:5432", i.e. 0.0.0.0 — the database sat
      # on the LAN. Nothing off-host has any reason to speak to it: the
      # dashboard and the orchestrator-spawned tenant bots all reach it
      # by service name over the compose network.
      #
      # Binding to 127.0.0.1 keeps the operator's workflows intact —
      # `docker compose exec -T postgres psql ...` still works, and a
      # GUI client still works over an SSH tunnel:
      #   ssh -L 15432:localhost:5432 root@$DEPLOY_HOST
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hypertrade"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Loopback-only. This was the most dangerous of the three
      # published ports: redis:7-alpine runs with NO password by default
      # (`requirepass` is empty), so reachability IS the access control.
      # Published on 0.0.0.0 it let any LAN host read
      # `dashboard:auth:session_secret` — the HMAC key that signs
      # session cookies, i.e. enough to forge a valid admin session
      # outright — plus the OIDC client secret, the basic-auth hash and
      # the Cloudflare API token.
      #
      # If you ever republish this beyond loopback, set `requirepass`
      # first and thread it through both the dashboard and the bots.
      - "127.0.0.1:6379:6379"
    volumes:
      # Redis holds the ONLY copy of the session secret, the auth mode,
      # the basic-auth hash, the OIDC client secret, the Cloudflare API
      # token, the per-bot API keys and the disabled-strategy sets.
      # Before this named volume, that lived in the image's anonymous
      # `/data` volume. Compose carries an anonymous volume over on
      # `up --force-recreate` (verified: a SAVEd key survives), so a
      # routine recreate was safe; the data went on `down` + `up`
      # (the new container gets a fresh anonymous volume), on
      # `down -v`, on a volume prune, or on FLUSHALL. Any of those
      # used to resolve the auth mode to "disabled" and serve the
      # operator's data to anyone (`lib/auth-config.ts:resolveMode`
      # now fails closed instead). A named volume survives `down` and
      # a prune of dangling anonymous volumes, and is findable by name
      # when dump.rdb has to be restored.
      #
      # No `command:` override on this service, so redis:7-alpine keeps
      # its default RDB snapshotting (save 3600 1 / 300 100 / 60 10000)
      # into /data. Deliberately NOT adding appendonly — the keys here
      # are configuration, and a minute of write loss on an unclean
      # kill is acceptable where a doubled disk-write rate on a trading
      # host is not.
      - redisdata:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ./dashboard
      args:
        # Same version stamp as bot-image above; see the comment there.
        GIT_SHA: "${GIT_SHA:-unknown}"
    ports:
      # Loopback-only. Neither real ingress path uses this — public
      # traffic arrives Cloudflare tunnel -> dashboard:3000 and LAN
      # traffic arrives caddy -> dashboard:3000, both over the compose
      # network. Published on 0.0.0.0 it was a third path that bypassed
      # both, and therefore sat outside Cloudflare's rate limiting, DDoS
      # protection and bot management.
      #
      # Kept on loopback so `localhost:3000` still works for local
      # development and for health probes over an SSH tunnel.
      - "127.0.0.1:3000:3000"
    environment:
      # Force Next.js standalone to bind 0.0.0.0. Setting HOSTNAME via
      # the Dockerfile ENV doesn't work because docker auto-injects
      # HOSTNAME=<container-id> at runtime, shadowing the image-level
      # value. Compose `environment:` overrides the docker default,
      # so it actually reaches the node process. Without this, Next.js
      # binds only to the container's docker-network address and the
      # in-container healthcheck (`wget localhost:3000/...`) fails with
      # "connection refused".
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (use 'phase run -- docker compose ...')}@postgres:5432/hypertrade
      REDIS_URL: redis://redis:6379/0
      # Dashboard routes to bots via the `tenant_bots` table
      # (container_name + mode), not via per-mode URL env vars.
      # Auth + TLS config is read straight from Redis, not via a
      # bot proxy.
      DASHBOARD_URL: "${DASHBOARD_URL:-http://localhost:3000}"
      # Used as base for OIDC redirect_uri. If unset, falls back to
      # DASHBOARD_URL, then to the request's origin (which inside Docker
      # resolves to the container hostname — breaks OIDC).
      PUBLIC_URL: "${PUBLIC_URL:-${DASHBOARD_URL:-http://localhost:3000}}"
      API_KEY: "${API_KEY:-}"
      # Phase-managed auth config (PR feat/phase-auth-autosync).
      # `phase run` injects these on the host before `docker compose up`;
      # the dashboard's `src/instrumentation.ts` hook mirrors any
      # non-empty value into Redis at startup so all auth-config
      # readers (UI, OIDC callback, /api/auth/login) stay in lockstep
      # with Phase. Defaulted to empty so a dashboard launched without
      # Phase (local dev, CI) still boots — the sync just skips
      # whichever keys are empty.
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_SCOPES: "${OIDC_SCOPES:-}"
      AUTH_MODE: "${AUTH_MODE:-}"
      # Operator-level Telegram alerting for the heartbeat watchdog
      # (feat/heartbeat-watchdog). `phase run` injects these; the
      # watchdog (src/lib/heartbeat-watchdog.ts) sends a DM directly to
      # the Telegram Bot API when a running tenant bot goes silent — a
      # dead bot can't alert about its own death. Defaulted empty so a
      # dashboard launched without Phase still boots; the watchdog logs
      # a warning and skips alerting (graceful degradation).
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      # Side-services owner (roadmap NU-7, lib/services-owner.ts): the mode
      # whose bot runs Telegram, HODL, the vault scanner and key reminders
      # for the operator tenant (other tenants keep mainnet).
      # The orchestrator sets TELEGRAM_ENABLED + SERVICES_OWNER on that bot
      # only; /hodl, /vaults and the unlock DM read it. Changing it takes
      # effect per bot on restart: restart the old owner first.
      HYPERTRADE_SERVICES_OWNER_MODE: "${HYPERTRADE_SERVICES_OWNER_MODE:-paper}"
      # The operator's vault-tracking wallet (Phase; never in the repo).
      # Injected on the operator's owner bot, which (paper by default) has
      # no mainnet account to fall back on.
      VAULT_TRACKING_ADDRESS: "${VAULT_TRACKING_ADDRESS:-}"
      # Heartbeat-watchdog tuning (src/lib/heartbeat-watchdog.ts).
      # POLL_SECONDS = how often the watchdog probes running bots;
      # STALE_SECONDS = heartbeat age past which a bot is "down".
      # Worst-case detection latency is the sum of the two (default
      # 60s + 300s = ~6 min). Defaults match the code fallbacks, so a
      # dashboard launched without Phase still uses the documented values.
      HEARTBEAT_WATCHDOG_POLL_SECONDS: "${HEARTBEAT_WATCHDOG_POLL_SECONDS:-60}"
      HEARTBEAT_WATCHDOG_STALE_SECONDS: "${HEARTBEAT_WATCHDOG_STALE_SECONDS:-300}"
      # Multi-tenancy Phase 3a: dashboard creates per-tenant bot
      # containers via the host docker daemon. The shared network
      # name lets bots reach postgres + redis on the internal docker
      # network without exposing extra ports.
      HYPERTRADE_DOCKER_NETWORK: "${HYPERTRADE_DOCKER_NETWORK:-hypertrade_default}"
      HYPERTRADE_BOT_IMAGE: "${HYPERTRADE_BOT_IMAGE:-xupertrade-bot:latest}"
      # Operator-policy caps — set in Phase via `phase secrets create
      # HYPERTRADE_BOT_<NAME>`. Defaults here match bot-orchestrator.ts
      # fallbacks; phase run -- substitutes the env value when set.
      HYPERTRADE_BOT_REDIS_URL: "${HYPERTRADE_BOT_REDIS_URL:-redis://redis:6379/0}"
      HYPERTRADE_BOT_PAPER_INITIAL_BALANCE: "${HYPERTRADE_BOT_PAPER_INITIAL_BALANCE:-10000}"
      HYPERTRADE_BOT_POLL_INTERVAL_SECONDS: "${HYPERTRADE_BOT_POLL_INTERVAL_SECONDS:-60}"
      HYPERTRADE_BOT_MAX_POSITION_SIZE_USD: "${HYPERTRADE_BOT_MAX_POSITION_SIZE_USD:-200}"
      HYPERTRADE_BOT_MAX_DAILY_LOSS_USD: "${HYPERTRADE_BOT_MAX_DAILY_LOSS_USD:-100}"
      HYPERTRADE_BOT_KILL_SWITCH: "${HYPERTRADE_BOT_KILL_SWITCH:-false}"
      HYPERTRADE_BOT_MAINNET_ENABLED_STRATEGIES: "${HYPERTRADE_BOT_MAINNET_ENABLED_STRATEGIES:-}"
      HYPERTRADE_BOT_MAX_TOTAL_EXPOSURE_USD: "${HYPERTRADE_BOT_MAX_TOTAL_EXPOSURE_USD:-5000}"
      HYPERTRADE_BOT_SIGNAL_SIZE_MAX_MULTIPLIER: "${HYPERTRADE_BOT_SIGNAL_SIZE_MAX_MULTIPLIER:-10}"
      HYPERTRADE_BOT_TAKER_FEE_RATE: "${HYPERTRADE_BOT_TAKER_FEE_RATE:-0.00045}"
      HYPERTRADE_BOT_TRADE_RATE_ALARM_ENABLED: "${HYPERTRADE_BOT_TRADE_RATE_ALARM_ENABLED:-true}"
      HYPERTRADE_BOT_TRADE_RATE_ALARM_BASELINE_MULTIPLIER: "${HYPERTRADE_BOT_TRADE_RATE_ALARM_BASELINE_MULTIPLIER:-5.0}"
      HYPERTRADE_BOT_TRADE_RATE_ALARM_MIN_HOURLY_FLOOR: "${HYPERTRADE_BOT_TRADE_RATE_ALARM_MIN_HOURLY_FLOOR:-5}"
      HYPERTRADE_BOT_TRADE_RATE_ALARM_ABSOLUTE_CEILING: "${HYPERTRADE_BOT_TRADE_RATE_ALARM_ABSOLUTE_CEILING:-20}"
      HYPERTRADE_BOT_TRADE_RATE_ALARM_CHECK_INTERVAL_SECONDS: "${HYPERTRADE_BOT_TRADE_RATE_ALARM_CHECK_INTERVAL_SECONDS:-300}"
      HYPERTRADE_BOT_HL_READ_TIMEOUT_SECONDS: "${HYPERTRADE_BOT_HL_READ_TIMEOUT_SECONDS:-5.0}"
      HYPERTRADE_BOT_HL_ORDER_TIMEOUT_SECONDS: "${HYPERTRADE_BOT_HL_ORDER_TIMEOUT_SECONDS:-15.0}"
      HYPERTRADE_BOT_HL_INIT_RETRY_ATTEMPTS: "${HYPERTRADE_BOT_HL_INIT_RETRY_ATTEMPTS:-5}"
      HYPERTRADE_BOT_HL_INIT_RETRY_BACKOFF_SECONDS: "${HYPERTRADE_BOT_HL_INIT_RETRY_BACKOFF_SECONDS:-2.0}"
      # Per-mode tenant-bot memory caps (bot-orchestrator.ts
      # memoryBytesForMode). The services owner (paper by default)
      # defaults to 1 GiB because it runs the vault scanner + HODL eval +
      # Telegram notifier on top of the strategy loop (pandas/pandas-ta
      # peaks during the daily vault scan OOM-killed it ×4 at 512 MiB,
      # 2026-06-17); every other bot stays at 512 MiB. Unset = use those
      # code defaults. A per-mode value here pins that mode regardless.
      # HYPERTRADE_BOT_MEMORY_BYTES is a global fallback for any mode
      # whose per-mode var is unset.
      HYPERTRADE_BOT_MEMORY_BYTES: "${HYPERTRADE_BOT_MEMORY_BYTES:-}"
      HYPERTRADE_BOT_PAPER_MEMORY_BYTES: "${HYPERTRADE_BOT_PAPER_MEMORY_BYTES:-}"
      HYPERTRADE_BOT_TESTNET_MEMORY_BYTES: "${HYPERTRADE_BOT_TESTNET_MEMORY_BYTES:-}"
      HYPERTRADE_BOT_MAINNET_MEMORY_BYTES: "${HYPERTRADE_BOT_MAINNET_MEMORY_BYTES:-}"
    volumes:
      # Multi-tenancy Phase 3a: dashboard binds the host's docker
      # socket so it can create/start/stop per-tenant bot containers
      # via dockerode. Same blast-radius as the operator already has
      # on the host (docker socket = root-equivalent), so no new
      # privilege boundary. Read-only would be ideal but dockerode
      # needs write for create/start/stop.
      - /var/run/docker.sock:/var/run/docker.sock
    # Add a supplementary group whose gid matches the host's
    # docker.sock owner (typically gid=105 on Debian/Ubuntu, 999 on
    # some others — check `stat -c '%g' /var/run/docker.sock`). The
    # dashboard runs as the unprivileged `nextjs` user (see
    # dashboard/Dockerfile), which lacks any group with access to
    # the docker socket — without this, bot-spawn calls fail with
    # `EACCES /var/run/docker.sock`. Override via DOCKER_GID env if
    # your host uses a different gid.
    group_add:
      - "${DOCKER_GID:-105}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      # Probe a dedicated liveness endpoint that has zero downstream
      # dependencies (no DB, no bot, no Redis) — just confirms the
      # Next.js process is serving requests. `/api/auth/config` was a
      # bad choice: it 503s when the bot is unreachable, cascading
      # bot outages into dashboard "unhealthy" even though the dashboard
      # itself is fine.
      #
      # wget (not curl) because node:22-alpine ships busybox wget but
      # not curl. busybox `wget --spider` returns 0 on 2xx and non-zero
      # on connection failure / 4xx-5xx — exactly what we want.
      #
      # 127.0.0.1 (not localhost): busybox wget tries IPv6 (`[::1]`)
      # first when given `localhost` and does NOT fall back to IPv4 on
      # connection-refused. Next.js standalone binds IPv4-only (no
      # tcp6 socket), so the IPv6 attempt fails and wget gives up.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    build: ./caddy
    container_name: hypertrade-caddy
    # --resume: boot from the last config the dashboard pushed through
    # the admin API (POST /api/tls/configure → /load) instead of the
    # bootstrap Caddyfile. Without it every container restart — a
    # deploy, a host reboot, a crash — dropped the pushed Let's Encrypt
    # config and served the self-signed bootstrap cert until someone
    # POSTed again. Only pushed configs are autosaved: the Caddyfile
    # sets `persist_config off`, so a host that never pushed keeps
    # booting the current Caddyfile, edits included.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--resume"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      # Default host the bootstrap Caddyfile issues a self-signed cert
      # for. Set in .env to match your dashboard hostname so browsers
      # don't get a name-mismatch warning on top of the self-signed one.
      CADDY_HOST: "${CADDY_HOST:-localhost}"
      # Where the autosave lives: /config/pushed/caddy/autosave.json on
      # the caddy_config volume. Deliberately NOT the image default
      # (/config/caddy/): builds before --resume autosaved every config
      # they loaded there, the bootstrap Caddyfile on each boot included,
      # so on an existing host that file is a stale snapshot (usually of
      # an old Caddyfile). Resuming it would silently undo later
      # Caddyfile fixes, e.g. #168's CF-Connecting-IP strip.
      XDG_CONFIG_HOME: /config/pushed
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      dashboard:
        condition: service_started

  # Cloudflare Tunnel: terminates public TLS at CF edge, forwards
  # the operator's configured public hostname to dashboard:3000 over
  # the internal docker network. No inbound ports — cloudflared
  # connects OUT to CF and accepts forwarded requests over that
  # tunnel.
  #
  # Caddy is intentionally kept for LAN access (operator on the
  # internal network reaches the dashboard via Caddy + Let's Encrypt).
  # Public users come through this tunnel and never touch Caddy or
  # the host's :443.
  #
  # CF DDoS-protection + bot-management apply to public traffic
  # automatically. Cloudflare Access (extra auth gate on top of
  # Authentik) is NOT enabled by default — opt in via the CF Zero
  # Trust UI if needed (see docs/CLOUDFLARE_TUNNEL.md).
  #
  # Profile-gated to opt-in: deploy with `--profile public` or
  # add `public` to COMPOSE_PROFILES so LAN-only deploys don't
  # need a CF account.
  cloudflared:
    # Pinned to a specific tag (NOT :latest) so deploys are
    # reproducible. cloudflared releases are frequent — bump this
    # tag intentionally after reading the changelog rather than
    # taking whatever happens to be on Docker Hub today.
    image: cloudflare/cloudflared:2026.3.0
    container_name: hypertrade-cloudflared
    profiles: [public]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # exec-form (YAML list) + `${VAR:?msg}` so a missing token
    # fails fast at compose-up time with a clear error instead of
    # crash-looping inside the container with an empty `--token`.
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required for the public profile (set in Phase, injected via `phase run`)}
    depends_on:
      dashboard:
        condition: service_started
    # cloudflared connects OUTBOUND to CF; no ports exposed.
    # Joining the default network gives it routing to dashboard:3000
    # via docker DNS.

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
